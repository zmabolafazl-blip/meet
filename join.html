<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ورود به جلسه | WebinarFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body class="page-shell">
    <header class="site-header compact-header">
      <div class="container nav-wrap">
        <a href="index.html" class="brand">
          <span class="brand-mark">W</span>
          <span>WebinarFlow</span>
        </a>
        <div class="nav-actions">
          <a class="btn btn-ghost" href="host.html">ساخت جلسه</a>
          <a class="btn btn-primary" href="index.html">بازگشت</a>
        </div>
      </div>
    </header>

    <main class="page-main">
      <div class="container form-layout narrow-layout">
        <section class="form-panel join-panel">
          <div class="panel-head">
            <span class="eyebrow">ورود به جلسه</span>
            <h1>مهمان / کاربر</h1>
            <p>برای ورود به جلسه، نام، کد جلسه و PIN را وارد کنید.</p>
          </div>

          <form id="joinForm" class="stack-form">
            <div class="field-group">
              <label for="guestName">نام شما</label>
              <input id="guestName" type="text" placeholder="مثلاً: سارا احمدی" required />
            </div>
            <div class="field-group">
              <label for="roomId">کد جلسه</label>
              <input id="roomId" type="text" placeholder="مثلاً: webinar-124" required />
            </div>
            <div class="field-group">
              <label for="joinPin">PIN جلسه</label>
              <input id="joinPin" type="text" placeholder="مثلاً: 4827" required maxlength="6" />
            </div>
            <button type="submit" class="btn btn-primary full-width">ورود به جلسه</button>
          </form>
        </section>
      </div>
    </main>

    <script src="assets/app.js"></script>
  </body>
</html>
